<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOMOUD AR · 3DGS</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    body{margin:0;background:#0e0d0b;font-family:system-ui,sans-serif;color:#efe7d4}
    model-viewer{width:100vw;height:100vh;--poster-color:#0e0d0b}
    .ar-btn{
      position:absolute;top:18px;right:18px;
      width:46px;height:46px;
      background:rgba(22,20,15,.7);backdrop-filter:blur(8px);
      border:1px solid rgba(201,162,75,.5);border-radius:12px;
      cursor:pointer;z-index:10;
      display:flex;align-items:center;justify-content:center;
      transition:border-color .2s,background .2s;
    }
    .ar-btn:hover{border-color:#c9a24b;background:rgba(201,162,75,.15)}
    .ar-btn svg{width:24px;height:24px;stroke:#c9a24b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

    /* loading bar */
    .progress{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
      width:180px;height:3px;background:rgba(201,162,75,.2);border-radius:3px;overflow:hidden}
    .progress .bar{height:100%;width:0;background:#c9a24b;transition:width .2s}
    .progress.hide{opacity:0;transition:opacity .4s}

    /* label */
    .label{position:absolute;left:18px;top:18px;z-index:10;
      font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a24b;
      background:rgba(22,20,15,.7);backdrop-filter:blur(8px);
      border:1px solid rgba(201,162,75,.3);border-radius:10px;padding:9px 12px}

    /* QR code (desktop only) */
    .qr{position:fixed;right:18px;bottom:18px;z-index:20;display:none;
      background:rgba(22,20,15,.78);backdrop-filter:blur(8px);
      border:1px solid rgba(201,162,75,.4);border-radius:14px;padding:10px;
      text-align:center;width:132px}
    .qr.show{display:block}
    .qr .code{background:#fff;border-radius:8px;padding:6px;line-height:0}
    .qr .code svg{width:100%;height:auto;display:block}
    .qr .cap{font-size:11px;line-height:1.5;color:#efe7d4;margin-top:8px;direction:rtl}

    /* big "open AR" button (phones only) */
    .open-ar{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:20;display:none;
      background:#c9a24b;color:#16140f;border:0;border-radius:999px;
      padding:14px 26px;font:600 15px system-ui,sans-serif;direction:rtl;
      box-shadow:0 6px 24px rgba(0,0,0,.4);cursor:pointer}
    .open-ar.show{display:block}
  </style>
</head>
<body>

<!-- Choose a model with ?m=NAME, e.g. index.html?m=angel-2 . Default: angel -->
<model-viewer
  id="mv"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  ar-placement="floor"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1">
  <div class="label" id="label">3DGS</div>
  <button slot="ar-button" class="ar-btn" title="مشاهده در AR">
    <svg viewBox="0 0 24 24">
      <path d="M12 2l8 4.5v9L12 20 4 15.5v-9L12 2z"/>
      <path d="M12 2v9M12 11l8-4.5M12 11L4 6.5"/>
    </svg>
  </button>
  <div class="progress" slot="progress-bar" id="progress"><div class="bar" id="bar"></div></div>
</model-viewer>

<div class="qr" id="qr">
  <div class="code" id="qrCode"></div>
  <div class="cap">با دوربین گوشی اسکن کنید تا AR باز شود</div>
</div>

<button class="open-ar" id="openAr">مشاهده در AR</button>

<script>
  const MODELS = {
    'angel':   { label: 'Angel · 3DGS',   alt: 'Angel with candlestick – 3D model' },
    'angel-2': { label: 'Angel II · 3DGS', alt: 'Kneeling angel with crossed arms – 3D model' }
  };
  const params = new URLSearchParams(location.search);
  const key = MODELS[params.get('m')] ? params.get('m') : 'angel';
  const mv = document.getElementById('mv');
  mv.src = key + '.glb';
  mv.iosSrc = key + '.usdz';
  mv.alt = MODELS[key].alt;
  document.getElementById('label').textContent = MODELS[key].label;
  document.title = 'NOMOUD AR · ' + MODELS[key].label;

  const bar = document.getElementById('bar');
  const progress = document.getElementById('progress');
  mv.addEventListener('progress', (e) => {
    const p = e.detail.totalProgress;
    bar.style.width = (p * 100) + '%';
    if (p >= 1) progress.classList.add('hide');
  });

  // ---------- device detection ----------
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isPhone = isIOS || isAndroid;

  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  const pageUrl = base + '?m=' + encodeURIComponent(key);
  const glbUrl = base + key + '.glb';
  const usdzUrl = base + key + '.usdz';

  // open the native AR viewer directly
  function openAR(fromTap) {
    if (isIOS) {
      if (fromTap) {
        const a = document.createElement('a');
        a.rel = 'ar';
        a.href = usdzUrl;
        a.appendChild(document.createElement('img'));
        document.body.appendChild(a);
        a.click();
        a.remove();
      } else {
        location.href = usdzUrl;          // Safari opens .usdz in AR Quick Look
      }
    } else if (isAndroid) {
      location.href = 'intent://arvr.google.com/scene-viewer/1.0?file=' + encodeURIComponent(glbUrl) +
        '&mode=ar_preferred#Intent;scheme=https;package=com.google.ar.core;' +
        'action=android.intent.action.VIEW;S.browser_fallback_url=' + encodeURIComponent(pageUrl + '&noauto=1') + ';end;';
    }
  }

  if (isPhone) {
    // phone: no QR, go straight to AR (once per visit), plus a big button as fallback
    const btn = document.getElementById('openAr');
    btn.classList.add('show');
    btn.addEventListener('click', () => openAR(true));

    let already = false;
    try { already = sessionStorage.getItem('ar-auto-' + key) === '1'; sessionStorage.setItem('ar-auto-' + key, '1'); } catch (e) {}
    if (!already && params.get('noauto') !== '1') {
      setTimeout(() => openAR(false), 400);
    }
  } else {
    // desktop / laptop: show a QR code of this link (bottom-right) for scanning with a phone
    const draw = () => {
      if (typeof qrcode !== 'function') return false;
      const qr = qrcode(0, 'M');
      qr.addData(pageUrl);
      qr.make();
      document.getElementById('qrCode').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      document.getElementById('qr').classList.add('show');
      return true;
    };
    if (!draw()) window.addEventListener('load', draw);
  }
</script>

</body>
</html>
